<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foto 1</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#1c1e21;padding:20px}
    .card{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.10);text-align:center}
    h1{font-size:26px;margin:0 0 12px}
    p{font-size:16px;line-height:1.45;margin:0 0 22px}
    .note{font-size:13px;color:#65676b;margin-top:14px}
    button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px 18px;font-size:18px;font-weight:700;cursor:pointer;text-decoration:none;background:#1877f2;color:white}
    #step2{display:none;margin-top:18px}
    .status{font-size:14px;margin-top:14px;min-height:20px;color:#444}
  </style>
</head>
<body>
  <main class="card">
    <section id="step1">
      <h1>Foto 1</h1>
      <p>Premi Prosegui per aprire direttamente il gruppo Facebook.</p>
      <button id="go">Prosegui</button>
      <div class="status" id="status"></div>
      <p class="note">Il testo viene preparato automaticamente negli appunti. Facebook richiede comunque la conferma finale del post.</p>
    </section>

    <section id="step2">
      <h1>Continua</h1>
      <p>Dopo aver pubblicato nel gruppo, prosegui per aprire la chat relativa a Foto 1.</p>
      <a class="btn" href="https://m.me/61593221212687?ref=foto1" target="_blank" rel="noopener">Prosegui</a>
    </section>
  </main>

<script>
const postText = `Super Consigliato. Esperienza molto positiva con FormaTesi. Tesi di Laurea perfetta.\n\nhttps://www.facebook.com/profile.php?id=61593221212687`;
const groupUrl = "https://www.facebook.com/groups/472752960893584";

document.getElementById("go").addEventListener("click", async () => {
  const status = document.getElementById("status");
  try {
    await navigator.clipboard.writeText(postText);
    status.textContent = "Testo pronto. Apertura del gruppo Facebook…";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = postText;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    status.textContent = "Testo pronto. Apertura del gruppo Facebook…";
  }

  document.getElementById("step2").style.display = "block";
  setTimeout(() => {
    window.location.href = groupUrl;
  }, 250);
});
</script>
</body>
</html>
